services:
   # ==================== INFRASTRUCTURE DE BASE ====================
  zookeeper:
    image: zookeeper:3.9.1
    container_name: zookeeper
    restart: always
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_4LW_COMMANDS_WHITELIST: "*"
    ports:
      - "2181:2181"
    volumes:
      - ./crawler/seed_urls.txt:/app/seed_urls.txt:ro
      - zookeeper_data:/data
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 127.0.0.1 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - moteur_network

  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_GROUP_ID: indexer-group-v2
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
      KAFKA_MAX_REQUEST_SIZE: 10485760
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    volumes:
      - ./crawler/seed_urls.txt:/app/seed_urls.txt:ro
      - kafka_data:/kafka
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - moteur_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
      - cluster.name=moteur-recherche
      - node.name=es-node-1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./crawler/seed_urls.txt:/app/seed_urls.txt:ro
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=50s || exit 1"]
      interval: 20s
      timeout: 20s
      retries: 10
      start_period: 40s
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 2g
    networks:
      - moteur_network

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - ./crawler/seed_urls.txt:/app/seed_urls.txt:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - moteur_network

  minio:
    image: minio/minio:RELEASE.2023-10-25T06-33-25Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - ./crawler/seed_urls.txt:/app/seed_urls.txt:ro
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - moteur_network


   # ==================== GATEWAY ET REVERSE PROXY ====================
  nginx-gateway:
    image: nginx:alpine
    container_name: nginx-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./crawler/seed_urls.txt:/app/seed_urls.txt:ro
      - ./nginx-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - search-service
      - user-service
      - admin-service
      - frontend-new
    networks:
      - moteur_network

   # ==================== CRAWLER SERVICES ====================
  scrapy-seeder:
    build:
      context: ./crawler/clean-scrapy-cluster
      dockerfile: docker/seeder/Dockerfile.py3
    image: scrapy-seeder:latest
    container_name: scrapy-seeder
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SEED_TOPIC: sc.seed.crawl
      SEED_URLS: "https://fr.wikipedia.org/wiki/Programmation_informatique,https://fr.wikipedia.org/wiki/Python_(langage),https://fr.wikipedia.org/wiki/JavaScript,https://fr.wikipedia.org/wiki/Base_de_données,https://fr.wikipedia.org/wiki/Algorithmique"
      SEED_INTERVAL: 300
      LOG_LEVEL: INFO
      SEED_BATCH_SIZE: 5
      SEED_CRAWLID: "moteur-recherche-init"
      SEED_APPID: "moteur-recherche"
      SEED_SPIDERID: "infoscraper"
      SEED_MAXDEPTH: 2
      SEED_PRIORITY: 1
    volumes:
      - ./crawler/seed_urls.txt:/app/seed_urls.txt:ro
      - ./crawler/clean-scrapy-cluster/cluster_config/seeder_config.json:/app/seeder_config.json:ro
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - moteur_network

  scrapy-scheduler:
    build:
      context: ./crawler/clean-scrapy-cluster
      dockerfile: docker/scheduler/Dockerfile.py3
    image: scrapy-scheduler:latest
    container_name: scrapy-scheduler
    environment:
      # Kafka
      KAFKA_BROKER: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: crawled_documents
      SEED_TOPIC: "sc.seed.crawl"
      CRAWL_TOPIC: "sc.crawl.request"
      STATUS_TOPIC: crawled_documents
      ERROR_TOPIC: sc.crawl.error
  
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      SPIDER_STARTREDIS_KEY: sc:start_urls
      
      # Zookeeper
      ZOOKEEPER_HOSTS: zookeeper:2181

      # Configuration du scheduler
      CONFIG_FILE: "/app/scheduler_config.json"
      SCHEDULER_ID: scheduler-1
      APP_ID: moteur-recherche
      CRAWL_ID: moteur-recherche-init
      SPIDER_ID: infoscraper
      
      # Logging
      LOG_LEVEL: INFO
      KAFKA_ENABLED: "true"
      AUTO_OFFSET_RESET: earliest
      GROUP_ID: scheduler-group
      
      # Network
      PUBLIC_IP: 127.0.0.1
      SCHEDULER_IP_ENABLED: "false"
      
      # Crawl limits
      MAX_DOMAIN_REQUESTS: 100
      MAX_PAGES_PER_DOMAIN: 50
      MIN_WAIT_TIME: 2
      MAX_WAIT_TIME: 5
      RETRY_TIMES: 2
    volumes:
      - ./crawler/seed_urls.txt:/app/seed_urls.txt:ro
      - ./crawler/clean-scrapy-cluster/cluster_config/scheduler_config.json:/app/scheduler_config.json:ro
    command: ["python", "scheduler.py", "--config", "/app/scheduler_config.json"]
    depends_on:
      redis:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - moteur_network
    restart: "no"


  scrapy-crawler:
    build:
      context: ./crawler/clean-scrapy-cluster
      dockerfile: docker/crawler/Dockerfile.py3
    image: scrapy-crawler-minimal:latest
    container_name: scrapy-crawler
    environment:
      SPIDER: infoscraper
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ZOOKEEPER_HOSTS: zookeeper:2181
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: crawled_documents
      CLUSTER_NAME: moteur-recherche
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: pdf-documents
      MINIO_SECURE: False
    volumes:
      - ./crawler/seed_urls.txt:/app/seed_urls.txt:ro
      - ./crawler/clean-scrapy-cluster/crawler:/usr/src/app/crawler:rw
      - ./crawler/clean-scrapy-cluster/crawling:/usr/src/app/crawling:ro
      - ./crawler/clean-scrapy-cluster/cluster_config/crawler_config.json:/usr/src/app/app/cluster_config/crawler_config.json:ro
      - ./crawler/clean-scrapy-cluster/docker/crawler/entrypoint.sh:/usr/src/app/docker/crawler/entrypoint.sh:ro   # ← script corrigé
    depends_on:
      redis:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - moteur_network
    restart: unless-stopped

  scrapy-rest:
    build:
      context: ./crawler/clean-scrapy-cluster
      dockerfile: docker/rest/Dockerfile.py3
    image: scrapy-rest:latest
    ports:
      - "5343:5343"
    environment:
      REST_PORT: 5343
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_HOSTS: kafka:9092
      KAFKA_TOPIC: crawled_documents
    depends_on:
      - redis
      - kafka
    networks:
      - moteur_network
   # ==================== MICROSERVICES CORE ====================
  indexing-service:
    build:
      context: ./indexing-service
      dockerfile: Dockerfile
    image: moteur-recherche-indexing:latest
    volumes:
      - ./indexing-service:/app   # on monte le code local
    environment:

      USE_NLP_SERVICE: True

      INDEX_BATCH_SIZE: 1
      # Kafka
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: crawled_documents
      KAFKA_GROUP_ID: indexer-group
      
      # Elasticsearch
      ES_HOSTS: http://elasticsearch:9200
      ES_INDEX: tech_docs
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: documents
      
      # NLP
    
      NLP_SERVICE_URL: http://nlp-service:8003

      EMBEDDING_DIMS: 1024
      
      # Service
      SERVICE_PORT: 8001
      LOG_LEVEL: INFO
    ports:
      - "8001:8001"
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nlp-service:
        condition: service_healthy
    networks:
      - moteur_network

  search-service:
    build:
      context: ./search_service
      dockerfile: Dockerfile
    image: moteur-recherche-search:latest
    environment:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      # Elasticsearch
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: tech_docs
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # NLP
      NLP_SERVICE_URL: http://nlp-service:8003
      
      # PageRank
      PAGERANK_SERVICE_URL: http://pagerank-service:8006

      # Minio
      MINIO_PUBLIC_URL: http://localhost:9000
      
      # Service
      SERVICE_PORT: 8002
      LOG_LEVEL: INFO
      CACHE_TTL: 300
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "8002:8002"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp-service:
        condition: service_healthy
    networks:
      - moteur_network

  nlp-service:
    build: ./nlp-service
    image: moteur-recherche-nlp:latest
    ports:
      - "8003:8003"
    volumes:
      - nlp_vocab:/app/data
    environment:
      - EMBEDDING_MODEL=dangvantuan/sentence-camembert-large
      - PORT=8003
    networks:
      - moteur_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3


  pagerank-service:
    build:
      context: ./pagerank
      dockerfile: Dockerfile
    image: moteur-recherche-pagerank:latest
    environment:
      SERVICE_PORT: 8006
      LOG_LEVEL: INFO
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: page_rank_updates
      REDIS_URL: redis://redis:6379/0
      UPDATE_INTERVAL: 3600
    ports:
      - "8006:8006"
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - moteur_network

   # ==================== USER SERVICES ====================
  user-db:
    image: postgres:15-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - user_db_data:/var/lib/postgresql/data
      # Pas de fichier d'initialisation pour éviter les erreurs
    healthcheck:
      # CORRECTION: Utiliser la base de données "userdb" au lieu de "user"
      test: ["CMD-SHELL", "pg_isready -U user -d userdb"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - moteur_network

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: moteur-recherche-user:latest
    container_name: user-service

    environment:
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      GOOGLE_CLIENT_ID: "822174207312-j09fp360u0pnkoc3859kf7aq39i2lodm.apps.googleusercontent.com"
      # Django
      DJANGO_SETTINGS_MODULE: user_service.settings.development
      DEBUG: "True"
      SECRET_KEY: "dev-secret-key-change-in-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1,user-service"

      # Horaire
      
      
      # Database
      DATABASE_NAME: userdb
      DATABASE_USER: user
      DATABASE_PASSWORD: password
      DATABASE_HOST: user-db
      DATABASE_PORT: 5432
      
      # Redis (utilise le redis central)
      REDIS_URL: "redis://redis:6379/1"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: 2
      
      # CORS
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost,http://frontend-new:3000"
      
      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      
      # Service
      SERVICE_PORT: 8004
      LOG_LEVEL: INFO
      
      # Network
      DATABASE_OPTIONS: '{"sslmode": "disable"}'
    ports:
      - "8004:8004"
    volumes:
        - ./user-service:/app
        - ./user-service/entrypoint.sh:/entrypoint.sh
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/entrypoint.sh"]
    networks:
      - moteur_network

  admin-service:
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    image: moteur-recherche-admin:latest
    environment:
      - SERVICE_PORT=8005
      - ALLOWED_HOSTS=localhost,127.0.0.1,admin-service,nginx-gateway
      - DATABASE_URL=postgresql://admin:admin@admin-db:5432/admindb
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379/2
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=${ADMIN_SECRET_KEY}
      - USER_SERVICE_URL=http://user-service:8004
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=2
    volumes:
      - ./admin-service:/app
      - /var/run/docker.sock:/var/run/docker.sock # Ajout --------
    command: >
      sh -c "python manage.py migrate --noinput &&
            python manage.py collectstatic --noinput &&
            daphne -b 0.0.0.0 -p 8005 config.asgi:application"
    ports:
      - "8005:8005"
    depends_on:
      admin-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - moteur_network

  admin-db:
    image: postgres:15-alpine
    container_name: admin-db
    environment:
      POSTGRES_DB: admindb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - admin_db_data:/var/lib/postgresql/data
    healthcheck:
      # CORRECTION: Utiliser la base de données "admindb"
      test: ["CMD-SHELL", "pg_isready -U admin -d admindb"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - moteur_network

    
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Interface web
    networks:
      - moteur_network


   # ==================== FRONTEND ====================
  frontend-new:
    build:
      context: ./moteur-recherche-frontend 
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    image: moteur-recherche-frontend:latest
    container_name: frontend-nuxt
    environment:
      # Environnement Nuxt
      NODE_ENV: production
      # NUXT_PUBLIC_API_BASE: http://localhost
      # NUXT_PUBLIC_API_BASE: http://localhost/api
      NUXT_PUBLIC_API_BASE: 
      NUXT_PUBLIC_APP_NAME: "Moteur de Recherche Informatique"
      NUXT_PUBLIC_APP_VERSION: "1.0.0"
      NUXT_PUBLIC_WS_BASE: ws://localhost/ws
      
      # Configuration serveur
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_PORT: 3000
      NITRO_HOST: 0.0.0.0
      
      # Network
      API_URL: http://nginx-gateway/api
      
      # Monitoring
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    volumes: []
      # Pour le développement, on peut monter le code source :
      # - ./moteur-recherche-frontend:/app
      # - /app/node_modules  # Empêche l'écrasement des node_modules
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - moteur_network


# ==================== MONITORING ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./crawler/seed_urls.txt:/app/seed_urls.txt:ro
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - elasticsearch
      - redis
      - kafka
    networks:
      - moteur_network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./crawler/seed_urls.txt:/app/seed_urls.txt:ro
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - moteur_network

  video-fetcher:
    build:
      context: ./video-fetcher
      dockerfile: Dockerfile
    container_name: video-fetcher
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - YOUTUBE_REQUEST_TOPIC=youtube.metadata.requests
      - YOUTUBE_UPDATED_TOPIC=youtube.metadata.updated
      - GROUP_ID=video-fetcher
      - BATCH_SIZE=20
    depends_on:
      - kafka
    networks:
      - moteur_network

volumes:
  zookeeper_data:
  kafka_data:
  redis_data:
  esdata:
  minio_data:
  nlp_models:
  user_db_data:
  admin_db_data:
  prometheus_data:
  grafana_data:
  nlp_vocab:

networks:
  moteur_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16


