<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- Le dégradé exact de votre header (Bleu vers Violet) -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" /> <!-- blue-500 -->
      <stop offset="100%" stop-color="#9333ea" /> <!-- purple-600 -->
    </linearGradient>
  </defs>
  
  <!-- Fond totalement transparent -->
  <rect width="24" height="24" fill="none" />
  
  <!-- Cercle de la loupe -->
  <circle cx="11" cy="11" r="8" />
  
  <!-- Le manche de la loupe -->
  <line x1="21" y1="21" x2="16.65" y2="16.65" />
</svg>