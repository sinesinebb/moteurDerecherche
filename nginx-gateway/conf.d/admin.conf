server {
    listen 80;
    
    location /admin {
        # Sécurité basique
        allow 192.168.1.0/24;  # Réseau interne
        allow 10.0.0.0/8;      # Réseau Docker
        deny all;
        
        proxy_pass http://admin-service:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Basic Auth (optionnel)
        auth_basic "Administration Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    location /admin/api {
        proxy_pass http://admin-service:8003/api;
        proxy_set_header Host $host;
    }
}