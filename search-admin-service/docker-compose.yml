version: '3.8'

services:
  admin-backend:
    build: .
    ports:
      - "8000:8000"  # Gunicorn principal
      - "8005:8005"  # Port alternatif pour tests
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5432/admin_service
      - REDIS_URL=redis://admin-redis:6379/0
      - SEARCH_SERVICE_URL=http://search-service:8002
      - CRAWLER_SERVICE_URL=http://crawler-service:8003
      - INDEXING_SERVICE_URL=http://indexing-service:8004
      - USER_SERVICE_URL=http://user-service:8001
      - DJANGO_SETTINGS_MODULE=search_admin.settings
      - CELERY_BROKER_URL=redis://admin-redis:6379/1
      - CELERY_RESULT_BACKEND=redis://admin-redis:6379/1
      - DEBUG=0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALLOWED_HOSTS=localhost,127.0.0.1,admin-backend,0.0.0.0
    command: [
      "gunicorn", 
      "search_admin.wsgi:application", 
      "--bind", "0.0.0.0:8000", 
      "--workers", "4",
      "--timeout", "120",
      "--log-level", "info",
      "--preload",
      "--access-logfile", "-",
      "--error-logfile", "-"
    ]
    depends_on:
      postgres:
        condition: service_healthy
      admin-redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery-worker:
    build: .
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5432/admin_service
      - REDIS_URL=redis://admin-redis:6379/0
      - CELERY_BROKER_URL=redis://admin-redis:6379/1
      - CELERY_RESULT_BACKEND=redis://admin-redis:6379/1
      - DJANGO_SETTINGS_MODULE=search_admin.settings
      - DEBUG=0
    command: celery -A search_admin worker --loglevel=info --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      admin-redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    healthcheck:
      test: ["CMD", "celery", "-A", "search_admin", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-beat:
    build: .
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5432/admin_service
      - REDIS_URL=redis://admin-redis:6379/0
      - CELERY_BROKER_URL=redis://admin-redis:6379/1
      - CELERY_RESULT_BACKEND=redis://admin-redis:6379/1
      - DJANGO_SETTINGS_MODULE=search_admin.settings
      - DEBUG=0
    command: celery -A search_admin beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      postgres:
        condition: service_healthy
      admin-redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media

  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: admin_service
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admin_service"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@search.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  admin-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --requirepass redispass
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Services de monitoring
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - admin-backend

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

  # Exporters pour le monitoring
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://admin:password@postgres:5432/admin_service?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - postgres

  redis-exporter:
    image: oliver006/redis_exporter
    environment:
      - REDIS_ADDR=redis://admin-redis:6379
      - REDIS_PASSWORD=redispass
    ports:
      - "9121:9121"
    depends_on:
      - admin-redis

  # Reverse Proxy Nginx pour la production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - admin-backend
    profiles:
      - production

  # Service de logs (optionnel)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    profiles:
      - monitoring

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

networks:
  default:
    name: search-admin-network