global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']
    metrics_path: '/_prometheus/metrics'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: '/metrics'

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']

  - job_name: 'microservices'
    static_configs:
      - targets: 
        - 'search-service:8002'
        - 'indexing-service:8001'
        - 'nlp-service:8003'
        - 'user-service:8004'
        - 'admin-service:8005'
        - 'pagerank-service:8006'