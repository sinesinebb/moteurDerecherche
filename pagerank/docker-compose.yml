version: '3.8'
services:
  redis:
    image: redislabs/redisgraph:latest
    networks:
      - moteur_network
    volumes:
      - redis-data:/data

  page-ranking:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    depends_on:
      - redis
    ports:
      - "8006:8000" 
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=tech_docs
    networks:
      - moteur_network

volumes:
  redis-data:

networks:
  moteur_network:
    external: true