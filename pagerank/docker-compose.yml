version: '3.8'
services:
  redis:
    image: redislabs/redisgraph:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  page-ranking:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    depends_on:
      - redis
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GRAPH_NAME: link_graph


volumes:
  redis-data:
