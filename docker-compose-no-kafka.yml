version: '3.8'

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - moteur_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=50s || exit 1"]
      interval: 20s
      timeout: 20s
      retries: 10
      start_period: 40s
    networks:
      - moteur_network

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - moteur_network

  indexing-service:
    build:
      context: ./indexing-service
      dockerfile: Dockerfile
    image: moteur_recherche_indexing:latest
    environment:
      DISABLE_KAFKA: "true"
      ES_HOSTS: http://elasticsearch:9200
      ES_INDEX: tech_docs
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      SERVICE_PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - moteur_network

  search-service:
    build:
      context: ./search_service
      dockerfile: Dockerfile
    image: moteur_recherche_search:latest
    environment:
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      REDIS_HOST: "redis"
      SERVICE_PORT: "8000"
      ELASTICSEARCH_INDEX: "tech_docs"
    ports:
      - "8002:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - moteur_network

  frontend:
    build:
      context: ./frontend/frontend-nuxt-freshe
      dockerfile: Dockerfile
    container_name: moteur-recherche-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NUXT_PUBLIC_API_BASE=http://localhost:8002
      - API_BASE_URL=http://search-service:8000
    depends_on:
      search-service:
        condition: service_healthy
    networks:
      - moteur_network

networks:
  moteur_network:
    driver: bridge
