global:
  scrape_interval: 15s
  evaluation_interval: 30s
  scrape_timeout: 10s

scrape_configs:
- job_name: "indexing-service"
  metrics_path: "/metrics"
  static_configs:
  - targets: [ "indexing-service:8000" ]
  relabel_configs:
  - source_labels: [ __address__ ]
    target_label: instance
    regex: "(.*):\\d+"
    replacement: "indexing-service"

- job_name: "elasticsearch"
  metrics_path: "/_prometheus/metrics"
  static_configs:
  - targets: [ "elasticsearch:9200" ]
  metric_relabel_configs:
  - source_labels: [ __name__ ]
    regex: "jvm_memory_bytes_used|indices_indexing_index_total|process_cpu_seconds_total"
    action: keep

- job_name: "kafka"
  static_configs:
  - targets: [ "kafka:9404" ]
  metric_relabel_configs:
  - source_labels: [ __name__ ]
    regex: "kafka_server_BrokerTopicMetrics_.*|kafka_network_RequestMetrics_.*"
    action: keep

- job_name: "redis"
  static_configs:
  - targets: [ "redis:9121" ]
  metric_relabel_configs:
  - source_labels: [ __name__ ]
    regex: "redis_memory_used_bytes|redis_commands_total|redis_connected_clients"
    action: keep

- job_name: "minio"
  metrics_path: "/minio/prometheus/metrics"
  static_configs:
  - targets: [ "minio:9000" ]
  metric_relabel_configs:
  - source_labels: [ __name__ ]
    regex: "minio_s3_requests_total|minio_s3_errors_total"
    action: keep

- job_name: "pipeline-metrics"
  static_configs:
  - targets: [ "indexing-service:8000" ]
  metric_relabel_configs:
  - source_labels: [ __name__ ]
    regex: "documents_processed_total|processing_time_seconds|kafka_messages_consumed_total"
    action: keep

rule_files:
- "/etc/prometheus/alerting_rules.yml"

alerting:
  alertmanagers:
  - static_configs:
    - targets: [ "alertmanager:9093" ]
