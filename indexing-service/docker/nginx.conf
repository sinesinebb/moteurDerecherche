worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;  # Autoriser les gros fichiers

    # Configuration du logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Configuration du serveur
    server {
        listen 80;
        server_name indexing-service;
        
        # Redirection vers HTTPS (décommenter en production)
        # return 301 https://$host$request_uri;

        # Health Checks
        location /health {
            proxy_pass http://localhost:8000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # Metrics Prometheus
        location /metrics {
            proxy_pass http://localhost:8000/metrics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API d'ingestion
        location /ingest {
            proxy_pass http://localhost:8000/ingest;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # Blocage des autres accès
        location / {
            return 403 '{"error": "Forbidden", "message": "Access denied"}';
            add_header Content-Type application/json;
        }
    }

    # Configuration HTTPS (décommenter en production)
    # server {
    #     listen 443 ssl;
    #     server_name indexing-service;
    #     
    #     ssl_certificate /etc/ssl/certs/indexing-service.crt;
    #     ssl_certificate_key /etc/ssl/private/indexing-service.key;
    #     
    #     # Configuration identique au serveur HTTP
    #     include conf.d/service-routes.conf;
    # }
}