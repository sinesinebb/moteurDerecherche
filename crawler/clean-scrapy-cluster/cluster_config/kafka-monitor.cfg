# kafka-monitor.cfg

# Adresse du broker
bootstrap.servers = kafka:9092

# Groupe de consumer
group.id = kafka-monitor

# Topic(s) à surveiller
topics = seed-urls,sc.crawl.items,sc.crawl.requests

# Sécurité (si nécessaire)
# security.protocol = SASL_PLAINTEXT
# sasl.mechanism = PLAIN
# sasl.username = <user>
# sasl.password = <pass>

# Logs en DEBUG pour plus de détails
log4j.rootLogger = DEBUG, stdout
log4j.logger.org.apache.kafka.clients.consumer = DEBUG






