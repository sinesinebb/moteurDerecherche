{
  "scheduler": {
    "KAFKA_BROKER": "kafka:9092",
    "KAFKA_BOOTSTRAP_SERVERS": "kafka:9092",
    "SEED_TOPIC": "sc.seed.crawl",
    "CRAWL_TOPIC": "sc.crawl.request",
    "STATUS_TOPIC": "crawled_documents",
    "ERROR_TOPIC": "sc.crawl.error",
    "ZOOKEEPER_HOSTS": "zookeeper:2181",
    "REDIS_URL": "redis://redis:6379/0",
    "SPIDER_STARTREDIS_KEY": "sc:start_urls",
    "LOG_LEVEL": "INFO",
    "INTERVAL": 5,
    "GROUP_ID": "scheduler-group",
    "AUTO_OFFSET_RESET": "earliest"
  }
  "kafka": {
    "bootstrap_servers": "kafka:9092",
    "topic_prefix": "sc",
    "consumer_group": "scheduler-group",
    "topics": {
      "seed": "sc.seed.crawl",
      "task": "sc.crawl.request",
      "crawl": "sc.crawl.crawled",
      "error": "sc.crawl.error"
    }
  },
  "zookeeper": {
    "hosts": "zookeeper:2181"
  }
}

